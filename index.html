<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIPLICATION QUIZZES</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>MULTIPLICATION QUIZZES</h1>

        <div class="row header">
            <h2>CHOOSE YOUR DIFFICULTY</h2>
        </div>

        <!-- Difficulty Selection Buttons -->
        <div class="buttons">
            <button class="button btn-easy" onclick="startQuiz('easy')">EASY (1-10)</button>
            <button class="button btn-medium" onclick="startQuiz('medium')">MEDIUM (1-25)</button>
            <button class="button btn-hard" onclick="startQuiz('hard')">HARD (1-50)</button>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <div class="timer">Time Elapsed: <span id="timeDisplay">0.0</span>s</div>
            <div class="question" id="questionDisplay">X × Y = ?</div>
            
            <div class="answer-box">
                <input type="number" id="answerInput" placeholder="Enter answer..." onkeydown="checkEnter(event)">
                <button class="submit-btn" id="submitBtn" onclick="checkAnswer()">Submit</button>
            </div>

            <div class="result" id="resultDisplay"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        let currentDifficulty = '';
        let num1 = 0;
        let num2 = 0;
        let correctAnswer = 0;
        
        let timerInterval = null;
        let startTime = 0;
        let elapsedTime = 0;

        function startQuiz(difficulty) {
            currentDifficulty = difficulty;
            document.getElementById('quizArea').style.display = 'block';
            nextQuestion();
        }

        function nextQuestion() {
            let maxNum = 10;
            if (currentDifficulty === 'medium') maxNum = 25;
            if (currentDifficulty === 'hard') maxNum = 50;

            num1 = Math.floor(Math.random() * maxNum) + 1;
            num2 = Math.floor(Math.random() * maxNum) + 1;
            correctAnswer = num1 * num2;

            document.getElementById('questionDisplay').innerText = `${num1} × ${num2}`;
            
            const answerInput = document.getElementById('answerInput');
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.focus();

            document.getElementById('resultDisplay').innerText = '';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('nextBtn').style.display = 'none';

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            startTime = Date.now();
            document.getElementById('timeDisplay').innerText = '0.0';

            timerInterval = setInterval(() => {
                elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('timeDisplay').innerText = elapsedTime;
            }, 100);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById('answerInput').value);
            
            if (isNaN(userAnswer)) {
                alert('Please enter a valid number.');
                return;
            }

            stopTimer();

            const resultDisplay = document.getElementById('resultDisplay');
            const answerInput = document.getElementById('answerInput');
            const submitBtn = document.getElementById('submitBtn');

            answerInput.disabled = true;
            submitBtn.disabled = true;

            if (userAnswer === correctAnswer) {
                resultDisplay.className = 'result correct';
                resultDisplay.innerText = `Correct! Time taken: ${elapsedTime} seconds`;
            } else {
                resultDisplay.className = 'result incorrect';
                resultDisplay.innerText = `Incorrect! The correct answer was ${correctAnswer}`;
            }

            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        }
    </script>
</body>

</html>
